<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Записка · Корпоративний Патронус</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="chest-page">
  <main class="stage">
    <article class="scroll">
      <h1>Записка</h1>
      <p class="ornament" aria-hidden="true">✦</p>
      <div class="story">
        <p>У скрині лежить записка. Натисни на згорток, щоб розгорнути її.</p>
      </div>
      <button type="button" class="roll" id="roll">
        <img src="images/scroll.png" alt="Згорток записки" />
      </button>
      <div class="unrolled" id="unrolled" hidden>
        <div class="story">
          <p>На ній небо і зорі. Яке сузір'я ти тут бачиш?</p>
        </div>
        <figure class="note">
          <img src="images/stars.jpg" alt="Небо і зорі на записці" />
        </figure>
        <form class="answer" id="answer-form" data-answers="велика ведмедиця,велику ведмедицю,великої ведмедиці" data-hint="" data-success="stars" data-ok="Прохід звільнено.">
          <label for="code">Впиши назву сузір'я</label>
          <input id="code" name="code" type="text" autocomplete="off" placeholder="назва сузір'я" />
          <button type="submit">Перевірити</button>
          <p class="status" id="status" hidden></p>
        </form>
        <a class="enter next is-disabled" id="next" href="room-7.html" aria-disabled="true">Йти далі</a>
      </div>
    </article>
  </main>
  <div class="stars" id="stars" hidden></div>
  <script src="room.js"></script>
  <script>
    document.getElementById("roll").addEventListener("click", () => {
      document.getElementById("roll").hidden = true;
      document.getElementById("unrolled").hidden = false;
    });
  </script>
</body>
</html>
