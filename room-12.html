<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Сортувальний капелюх · Корпоративний Патронус</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background: #070b10 url("images/stars-bg.jpg") center center / cover no-repeat fixed;
      min-height: 100vh;
    }
    .scroll {
      background: rgba(8, 12, 16, 0.45);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(231, 215, 168, 0.25);
    }
    h1 {
      font-size: clamp(1.7rem, 4.2vw, 2.6rem);
      margin-bottom: 4px;
    }
    .faculties-subtitle {
      margin: 4px 0 28px;
      font-family: Cinzel, serif;
      letter-spacing: 0.1em;
      color: #e7d7a8;
      font-size: 0.95rem;
    }
    .hat-scene {
      margin: 0 auto 24px;
      max-width: 640px;
      text-align: center;
    }
    #hat-video {
      width: 100%;
      max-height: 520px;
      border-radius: 14px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.7);
      background: #0a0a0a;
    }
    .emblems-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
      margin: 10px auto 32px;
      max-width: 900px;
    }
    .emblem-card {
      width: 150px;
      text-align: center;
    }
    .emblem {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.65));
    }
    .faculty-btn {
      display: inline-block;
      margin-top: 6px;
      text-decoration: none;
      color: #f8f1df;
      background: linear-gradient(180deg, #2f6a56, #1c4338);
      border: 1px solid #c6a15b;
      font-family: Cinzel, serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 36px;
      font-size: 0.92rem;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(20, 40, 32, 0.35);
      border-radius: 2px;
    }
    .faculty-btn:hover {
      background: linear-gradient(180deg, #3a7d66, #245445);
    }
    @media (max-width: 700px) {
      .emblem-card { width: 120px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <article class="scroll">
      <h1>Сортувальний капелюх</h1>
      <p class="faculties-subtitle">Факультети: Кодерін · Кібермор · Датавіс · Пікселіус</p>

      <div class="hat-scene">
        <video id="hat-video" playsinline autoplay muted loop>
          <source src="images/sorting-hat.mp4" type="video/mp4">
          Ваш браузер не підтримує відео.
        </video>
        <audio id="hat-audio" src="images/sorting-hat-audio.mp3"></audio>
      </div>

      <div class="emblems-row">
        <div class="emblem-card">
          <img class="emblem" src="images/emblem-coderin.png" alt="Кодерін">
        </div>
        <div class="emblem-card">
          <img class="emblem" src="images/emblem-cybermor.png" alt="Кібермор">
        </div>
        <div class="emblem-card">
          <img class="emblem" src="images/emblem-datavis.png" alt="Датавіс">
        </div>
        <div class="emblem-card">
          <img class="emblem" src="images/emblem-pikselus.png" alt="Пікселіус">
        </div>
      </div>

      <button class="faculty-btn" id="choose-btn">Який факультет?</button>
    </article>
  </main>

  <script>
    const video = document.getElementById("hat-video");
    const audio = document.getElementById("hat-audio");

    window.addEventListener("load", () => {
      video.play().catch(() => {});
      audio.play().catch(() => {
        document.body.addEventListener("click", () => audio.play(), { once: true });
      });
    });

    const faculties = [
      { id: "coderin", name: "Кодерін" },
      { id: "cybermor", name: "Кібермор" },
      { id: "datavis", name: "Датавіс" },
      { id: "pikselus", name: "Пікселіус" }
    ];

    document.getElementById("choose-btn").addEventListener("click", () => {
      const chosen = faculties[Math.floor(Math.random() * faculties.length)];
      sessionStorage.setItem("chosenFaculty", chosen.id);
      window.location.href = "room-13.html?faculty=" + chosen.id;
    });
  </script>
</body>
</html>
