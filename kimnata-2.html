<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Блукаюча кімната · Корпоративний Патронус</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="room room-1">
  <aside class="collected" id="collected">
    <h2>Зібрані підказки</h2>
    <ul id="collected-list"></ul>
  </aside>
  <main class="stage">
    <article class="scroll">
      <p class="eyebrow">Кімната 2</p>
      <h1>Блукаюча кімната</h1>
      <p class="ornament" aria-hidden="true">✦</p>
      <div class="story">
        <p>Що має міста, але не має будинків; ліси, але не має дерев; річки, але не має води?</p>
      </div>
      <form class="answer" id="answer-form" data-answers="карта,карту,картою" data-hint="Карта" data-ok="Двері відчиняються. Знайдений предмет: Карта">
        <label for="code">Впиши правильну відповідь</label>
        <input id="code" name="code" type="text" autocomplete="off" placeholder="кодове слово" />
        <button type="submit">Перевірити</button>
        <p class="status" id="status" hidden></p>
      </form>
      <p class="hint-box" id="hint" hidden>Карта</p>
      <a class="enter next is-disabled" id="next" href="kimnata-3.html" aria-disabled="true">Йти далі</a>
    </article>
  </main>
  <div class="stars" id="stars" hidden></div>
  <script src="room.js"></script>
</body>
</html>
