<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Записка · Корпоративний Патронус</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .note-image-scene {
      margin: 30px auto;
      max-width: 680px;
      text-align: center;
    }
    #note-image {
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.65);
    }
  </style>
</head>
<body class="office-page">
  <main class="stage">
    <article class="scroll">
      <h1>Записка</h1>
      <p class="ornament" aria-hidden="true">✦</p>
      <div class="story">
        <p>Записка відкрилася. На ній загадка...</p>
      </div>
      <div class="note-image-scene">
        <img id="note-image" src="images/note-riddle.jpg" alt="Записка з загадкою">
      </div>
      <form class="answer" id="answer-form" data-answers="кіт,кота" data-ok="Вірно! Це кіт." data-redirect="room-11.html">
        <label for="code">Впиши відповідь на загадку</label>
        <input id="code" name="code" type="text" autocomplete="off" placeholder="відповідь" />
        <button type="submit">Перевірити</button>
        <p class="status" id="status" hidden></p>
      </form>
    </article>
  </main>
  <script src="room.js"></script>
</body>
</html>
