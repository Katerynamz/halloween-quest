<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Корпоративний Патронус · Softkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body.office-page {
      background: url("images/night-bg.jpg") center center / cover no-repeat fixed;
    }
    .patronus-scene {
      margin: 30px auto;
      max-width: 640px;
      text-align: center;
    }
    #patronus-video {
      width: 100%;
      max-height: 520px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.65);
      background: #0a0a0a;
    }
    .congrats {
      margin-top: 24px;
      font-size: 1.45rem;
      color: #f7e7b0;
      text-align: center;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .back-btn {
      display: inline-block;
      margin-top: 28px;
      text-decoration: none;
      color: #f8f1df;
      background: linear-gradient(180deg, #2f6a56, #1c4338);
      border: 1px solid #c6a15b;
      font-family: Cinzel, serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 14px 32px;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(20, 40, 32, 0.28);
    }
    .back-btn:hover {
      background: linear-gradient(180deg, #3a7d66, #245445);
    }
  </style>
</head>
<body class="office-page">
  <main class="stage">
    <article class="scroll">
      <h1>Корпоративний Патронус</h1>
      <p class="ornament" aria-hidden="true">✦</p>
      <div class="patronus-scene">
        <video id="patronus-video" autoplay playsinline loop>
          <source src="images/patronus-cat.mp4" type="video/mp4">
          Ваш браузер не підтримує відео.
        </video>
      </div>
      <p class="congrats">Вітаю! Ти знайшов корпоративний патронус Softkit !</p>
      <a class="back-btn" href="room-12.html">Повернутись до офісу</a>
    </article>
  </main>

  <script>
    const video = document.getElementById("patronus-video");

    window.addEventListener("load", () => {
      video.play().catch(() => {
        document.body.addEventListener("click", () => video.play(), { once: true });
      });
    });
  </script>
</body>
</html>
