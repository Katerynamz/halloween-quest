<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Фенікс · Корпоративний Патронус</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .phoenix-scene {
      position: relative;
      margin: 30px auto;
      max-width: 640px;
      height: 500px;
      text-align: center;
      overflow: hidden;
      background: #0a0a0a;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    #phoenix-video,
    #note-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    #note-video { display: none; }
    .item-block {
      margin: 28px auto 0;
      max-width: 560px;
      text-align: center;
      display: none;
    }
    .item-block.visible { display: block; }
    .item-prompt {
      font-size: 1.25rem;
      color: #e7d7a8;
      margin-bottom: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body class="office-page">
  <main class="stage">
    <article class="scroll">
      <h1>Фенікс</h1>
      <p class="ornament" aria-hidden="true">✦</p>
      <div class="story">
        <p>Фенікс згорає у власному полум’ї і залишає після себе лише попіл...</p>
        <p>У попелі щось лежить...</p>
      </div>
      <div class="phoenix-scene" id="scene">
        <video id="phoenix-video" autoplay muted playsinline>
          <source src="images/phoenix-burn.mp4" type="video/mp4">
          Ваш браузер не підтримує відео.
        </video>
        <video id="note-video" muted playsinline loop>
          <source src="images/note-in-ashes.mp4" type="video/mp4">
        </video>
      </div>

      <div class="item-block" id="item-block">
        <p class="item-prompt">В тебе залишився один предмет (підказка), який допоможе тобі відкрити зміст записки. Що це?</p>
        <form class="answer" id="answer-form" data-answers="чарівна паличка,паличка,чарівнапаличка" data-ok="Записка відкривається..." data-redirect="room-10.html">
          <label for="code">Впиши предмет</label>
          <input id="code" name="code" type="text" autocomplete="off" placeholder="предмет" />
          <button type="submit">Відкрити</button>
          <p class="status" id="status" hidden></p>
        </form>
      </div>
    </article>
  </main>
  <script>
    const phoenixVideo = document.getElementById("phoenix-video");
    const noteVideo = document.getElementById("note-video");
    const itemBlock = document.getElementById("item-block");

    phoenixVideo.addEventListener("ended", () => {
      phoenixVideo.style.display = "none";
      noteVideo.style.display = "block";
      noteVideo.play();
      itemBlock.classList.add("visible");
      setTimeout(() => document.getElementById("code").focus(), 400);
    });
  </script>
  <script src="room.js"></script>
</body>
</html>
