<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Скриня · Корпоративний Патронус</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="chest-page">
  <main class="stage">
    <article class="scroll">
      <h1>Заборонений ліс</h1>
      <p class="ornament" aria-hidden="true">✦</p>
      <div class="story">
        <p>Павук може пройти скрізь, а ти ні. На твоєму шляху перша перешкода. Усунь її, аби знайти те, що шукаєш, і воно саме з'явиться.</p>
        <p>Розгадавши ребус, цей предмет з'явиться перед тобою.</p>
      </div>
      <figure class="rebus">
        <img src="images/rebus.jpg" alt="Ребус" />
      </figure>
      <form class="answer" id="answer-form" data-answers="скриня,скриню" data-hint="" data-success="chest">
        <label for="code">Впиши правильну відповідь</label>
        <input id="code" name="code" type="text" autocomplete="off" placeholder="кодове слово" />
        <button type="submit">Перевірити</button>
        <p class="status" id="status" hidden></p>
      </form>
      <div class="chest" id="chest" hidden>
        <img src="images/chest.png" alt="Скриня" />
      </div>
      <a class="enter next" id="next" href="room-6.html" hidden>Йти далі</a>
    </article>
  </main>
  <script src="room.js"></script>
</body>
</html>
